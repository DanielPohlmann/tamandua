# Superpowers feature pipeline — plan-driven, verifier-gated, PR at the end.
#
# Spec + plans are authored and approved by a human (docs/superpowers/). This
# workflow does NOT re-plan: load-plan turns the plan files into ordered stories,
# implement drives each plan with superpowers:executing-plans (TDD) and verify
# checks each plan. Then deterministic gates run cheapest-first:
#
#   unit -> security (checks + verifier) -> review (checks + verifier)
#        -> e2e (checks + verifier) -> ci-local -> pr
#
# Gate commands live in the TARGET repository (scripts/gates/*.mjs); a non-zero
# exit fails the gate. Verifier agents are read-only: they only report
# FINDINGS_JSON. Any failing gate hands its open blocking/major findings to the
# `fix` step (the developer — the only agent that changes code), then the same
# gate runs again. Budgets: 3 fix rounds per gate, 8 per run; exhausting one, or a
# disputed finding raised again, BLOCKS the run for a human.
#
# Run (worktree-isolated, PR against develop, never merges):
#   tamandua workflow run superpowers-feature "docs/superpowers/specs/<feature>-design.md" \
#     --worktree-origin-repository <path-to-your-repo> \
#     --worktree-origin-ref develop
# Override the PR/base branch per run with: --context base_branch=main
# Inspect: tamandua workflow status <run> --json | tamandua workflow findings <run>
# Unblock: tamandua workflow resume <run> [--max-rounds n] [--max-fix-rounds n] [--max-tokens n]
#
# Requires: scripts/gates/{unit,security-checks,review-checks,e2e-checks,ci-local}.mjs
# in the target repo, a GitHub remote and an authenticated `gh` CLI.
id: superpowers-feature
name: Superpowers Feature (plan-driven, verifier-gated, PR)
version: 2
description: |
  Plan-driven feature pipeline. Loads an approved spec (or plan set), drives each
  plan with superpowers:executing-plans under TDD, verifies each plan, then runs
  deterministic gates (unit, security, review, e2e, local CI) backed by read-only
  verifier agents. Failing gates loop through a single fix step owned by the
  developer. Opens a PR against the base branch — it never merges.
polling:
  model: default
  timeoutSeconds: 120

context:
  base_branch: develop   # PR target + review/baseline diff. Override: --context base_branch=main
  reviewed_sha: ""       # last commit the review verifier reviewed (re-review scope)

budgets:
  max_fix_rounds: 8

agents:
  - id: planner
    name: Plan Loader
    role: analysis
    description: Reads the pre-approved plan files and derives ordered stories.
    workspace:
      baseDir: agents/planner
      skills:
        - tamandua-agents

  - id: setup
    name: Setup
    role: coding
    description: Creates the feature branch and establishes a build/test baseline.
    workspace:
      baseDir: agents/setup
      skills:
        - tamandua-agents

  - id: developer
    name: Developer
    role: coding
    description: Implements each plan with tests and fixes every gate finding. The only agent that changes code.
    timeoutSeconds: 2400
    workspace:
      baseDir: agents/developer
      skills:
        - tamandua-agents

  - id: verifier
    name: Verifier
    role: verification
    description: Per-plan verification against acceptance criteria.
    workspace:
      baseDir: agents/verifier
      skills:
        - agent-browser
        - tamandua-agents
      files:
        AGENTS.md: ../../agents/shared/verifier/AGENTS.md
        SOUL.md: ../../agents/shared/verifier/SOUL.md
        IDENTITY.md: ../../agents/shared/verifier/IDENTITY.md

  - id: security
    name: Security Verifier
    role: verification
    description: Triages scanner output and reviews the diff for security flaws. Read-only.
    timeoutSeconds: 2400
    workspace:
      baseDir: agents/security
      skills:
        - tamandua-agents

  - id: reviewer
    name: Review Verifier
    role: verification
    description: Reviews the diff against the repository's review rules. Read-only.
    timeoutSeconds: 2400
    workspace:
      baseDir: agents/reviewer
      skills:
        - tamandua-agents

  - id: tester
    name: E2E Verifier
    role: testing
    description: Walks every acceptance criterion in a real browser. Read-only.
    timeoutSeconds: 2400
    workspace:
      baseDir: agents/tester
      skills:
        - tamandua-agents

  - id: pr
    name: PR Publisher
    role: pr
    description: Pushes the branch through the pre-push hook and opens the PR. Never merges.
    workspace:
      baseDir: agents/pr
      skills:
        - tamandua-agents


steps:
  - id: load-plan
    agent: planner
    input: |
      You are loading a PRE-APPROVED design spec (or plan set) and enumerating the
      implementation PLAN FILES to execute. You do NOT plan or invent scope — the
      spec and plans were authored and approved by a human. Each plan file is one
      story; the developer will drive each plan with superpowers:executing-plans.

      INPUT: {{task}}
        - If it is a SPEC path (docs/superpowers/specs/*-design.md): read it, then
          resolve the ordered set of plan files under docs/superpowers/plans/ that
          implement it.
        - If it is one or more PLAN paths (docs/superpowers/plans/*.md, space- or
          comma-separated): use them directly as the plan set.
      BASE BRANCH: {{base_branch}}
      You are already inside the repo/worktree (your current working directory is the repo root).

      RETRY FEEDBACK (only present if your previous attempt was rejected — fix exactly what it raises):
      {{retry_feedback}}

      Instructions:
      1. Read the input. If it is a spec, read its Scope and any Branch field.
      2. Resolve the plan files that implement it:
         - Prefer an explicit list in the spec (e.g. a "## Plans" section listing plan files in order).
         - Otherwise match plans in docs/superpowers/plans/ by shared date/topic prefix and cross-check against the spec Scope.
         - If you cannot CONFIDENTLY determine the full, correct plan set, STOP: end with STATUS: failed and a REASON asking the human to pass the explicit plan paths.
      3. Order the plans by their declared "Prerequisites" (topological order — a plan another depends on runs first).
      4. Read CLAUDE.md and .planning/codebase/ (ARCHITECTURE, STRUCTURE, CONVENTIONS, TESTING) to align branch naming and ubiquitous language.
      5. Choose a fresh feature branch name (feature/<short-desc>). It MUST NOT be a default/integration branch (main, master, develop, dev, release).
      6. Decide FEATURE_COMPLETE: does this spec/plan set deliver a COMPLETE user-facing feature (usable end to end by a real user)? true only if yes; false for backend-only/infra/refactor. This drives whether E2E runs.

      Emit ONE story per plan file, in execution order (max 20). Each story:
        - id: US-00N (in execution order)
        - title: the plan's title
        - description: MUST begin with a line "PLAN_FILE: <path/to/plan.md>", then the plan's Goal and its Prerequisites.
        - acceptanceCriteria: derived from the plan Goal PLUS these three, always: "All files in the plan's File Map are created/modified as specified (including its unit-test files)", "Unit tests written test-first and passing", "Build passes".

      Reply with:
      STATUS: done
      REPO: <absolute path to the repo root>
      BRANCH: <fresh feature branch name>
      FEATURE_COMPLETE: <true|false>
      PLAN_SET: <ordered list of the plan file paths you will execute>
      PLAN_SUMMARY: <2-4 line summary of what the spec/plan set delivers>
      STORIES_JSON: [ ... literal JSON array, one story per plan, in execution order ... ]

      The STORIES_JSON line is REQUIRED and MUST be a literal JSON array — without it the run cannot proceed.
      If the input cannot be read or the plan set cannot be resolved confidently, end with STATUS: failed and a REASON: line.
    expects: "STATUS: done"
    max_retries: 3
    on_fail:
      escalate_to: human

  - id: setup
    agent: setup
    input: |
      Prepare the worktree for this feature.

      REPO: {{repo}}
      BRANCH: {{branch}}
      BASE BRANCH: {{base_branch}}
      SPEC/PLANS: {{task}}

      RETRY FEEDBACK (only present if your previous attempt was rejected):
      {{retry_feedback}}

      Instructions:
      1. Ensure you are at the repo root ({{repo}}).
      2. Create the feature branch: git checkout -b {{branch}} (if it already exists, just check it out).
      3. Read CLAUDE.md and .planning/codebase/STACK.md + TESTING.md to learn the exact build/test commands and project layout.
      4. Establish a baseline WITHOUT pushing:
         - Backend: build the solution and identify the unit-test command.
         - Frontends (frontend/admin-spa, frontend/public-nuxt): identify their commands only if the plan touches them.
      5. Do NOT run the full lefthook/ci-local here — only enough to confirm the tree builds.

      Reply with:
      STATUS: done
      BUILD_CMD: <backend build command>
      TEST_CMD: <backend unit-test command>
      FRONTEND_CMD: <frontend ci/test command, or "n/a">
      BASELINE: <baseline result — does it build/test clean?>
    expects: "STATUS: done"
    max_retries: 3
    on_fail:
      escalate_to: human

  - id: implement
    agent: developer
    type: loop
    loop:
      over: stories
      completion: all_done
      fresh_session: true
      verify_each: true
      verify_step: verify
    input: |
      Implement ONE plan from the approved set by DRIVING IT WITH
      superpowers:executing-plans, in a fresh session, following the project's
      CLAUDE.md and .planning/codebase conventions. This story IS one plan file.

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}
      SPEC/PLANS (overall input, for context): {{task}}

      CURRENT PLAN (this story = one plan file; its PLAN_FILE path is the first line of the description):
      {{current_story}}

      COMPLETED PLANS:
      {{completed_stories}}
      PLANS REMAINING: {{stories_remaining}}

      VERIFY FEEDBACK (if retrying — fix exactly what it raised):
      {{verify_feedback}}

      TIMEOUT RETRY (if the previous attempt timed out — check git log/status first and resume from where it stopped instead of redoing finished work):
      {{timeout_retry}}

      PROGRESS LOG:
      {{progress}}

      Instructions:
      1. Read progress-{{run_id}}.txt (the Codebase Patterns section first). Pull latest on the branch.
      2. Extract the PLAN_FILE path from the current story. ALWAYS drive this plan with superpowers:executing-plans — announce it and follow the plan task-by-task, honoring its checkbox (- [ ]) steps and running the verifications it specifies. (If the plan's own header recommends superpowers:subagent-driven-development and subagents are available, follow the plan's guidance.)
      3. Enforce TDD (superpowers:test-driven-development): NO production code without a failing test first. The plan's File Map lists the unit-test files — write them test-first (Red → Green → Refactor). Backend logic never ships without tests.
      4. BEFORE coding each part, list the skills available in your environment and consult the relevant project skill for that domain (skills override training data — see your AGENTS.md). Load only what the current story touches. Respect bounded-context boundaries and ubiquitous language.
      5. If a test fails unexpectedly or a fix does not work on the second attempt, STOP guessing and apply superpowers:systematic-debugging — hypothesize, isolate, verify — before touching more code.
      6. Update the living docs when the change warrants it, per the project CLAUDE.md update rules (e.g. .planning/codebase/ — architecture, structure, stack, conventions, testing — including their Analysis Date). Docs-only edits ride along with the plan's commits.
      7. Commit following the repository's CLAUDE.md commit conventions. One logical change per commit.
      8. Rewrite progress-{{run_id}}.txt with this plan's results and any reusable patterns.

      DO NOT run superpowers:finishing-a-development-branch and DO NOT open a PR — this pipeline owns branch completion, CI, and PR in later steps. Stop once this plan's tasks are implemented, its tests pass, and changes are committed.

      FINAL VALIDATION (before reporting done) — run superpowers:verification-before-completion against this checklist:
      - Every unit-test file in the plan's File Map exists and passes.
      - Every new/changed unit of backend logic has a corresponding test that was written test-first.
      - Build and {{test_cmd}} are green.
      - Living docs updated if the change warranted it.
      If any of these is missing, the plan is NOT done — finish it or report the blocker.

      Never stage or commit secrets (.env, *.key, *.pem, credentials.*, node_modules/).

      Reply with:
      STATUS: done
      CHANGES: what you implemented (reference the PLAN_FILE)
      TESTS: the unit tests written (test-first) and their result
    expects: "STATUS: done"
    max_retries: 4
    on_fail:
      escalate_to: human

  - id: verify
    agent: verifier
    input: |
      Verify the developer's execution of the CURRENT PLAN.

      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      TEST_CMD: {{test_cmd}}

      CURRENT PLAN (its PLAN_FILE path is the first line of the description):
      {{current_story}}

      PROGRESS LOG:
      {{progress}}

      Check (open the PLAN_FILE and use its File Map as the checklist):
      1. The plan's File Map is realized — every file created/modified as specified (spot-check the key ones), no TODOs or placeholders.
      2. Every unit-test file listed in the plan's File Map exists.
      3. Unit tests pass (run {{test_cmd}}) and exercise real behavior for the plan (not just mocks).
      4. Build/typecheck passes.
      5. The plan's Goal / acceptance criteria are met.

      Has frontend changes: {{has_frontend_changes}}
      If 'true', use the agent-browser skill to render the changed UI and confirm it is not broken (layout, missing elements, unstyled content). If 'false', skip visual checks.

      Reply with:
      STATUS: done
      VERIFIED: what you confirmed

      Or if incomplete:
      STATUS: retry
      ISSUES:
      - what is missing (e.g. missing test file, failing test, unrealized File Map entry)
    expects: "STATUS: done"
    on_fail:
      # retry_step is informational; per-story retries are engine-fixed at 4.
      # (on_fail.max_retries is not read by the runtime — deliberately omitted.)
      retry_step: implement
      on_exhausted:
        escalate_to: human

  - id: gate-unit
    type: bash
    run: node scripts/gates/unit.mjs
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-security-checks
    type: bash
    run: node scripts/gates/security-checks.mjs
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-security
    agent: security
    input: |
      Security verification of the branch. You are READ-ONLY: never edit, create,
      delete or commit files. Report findings; the developer fixes them.

      REPO: {{repo}}
      BRANCH: {{branch}}
      BASE BRANCH: {{base_branch}}
      PLANS: {{plan_set}}

      SCANNER OUTPUT (gate-security-checks, last 200 lines):
      {{gate_security_checks_output}}

      FINDINGS YOU RAISED BEFORE (JSON, with status — never re-raise a resolved one unless it is truly back):
      {{findings_gate_security}}

      RETRY FEEDBACK (only if your previous reply was rejected):
      {{retry_feedback}}

      Instructions:
      1. Read the diff: git diff origin/{{base_branch}}...HEAD (fall back to {{base_branch}}...HEAD).
      2. Triage the scanner output: drop false positives (say why in your summary), keep real ones as findings.
      3. Look for what scanners miss, using the security skills your project's CLAUDE.md names: authn/authz, IDOR, tenant isolation, personal data handling, error payloads that leak internals, oversized message payloads.
      4. Every finding needs file, evidence and a stable rule id (semgrep/<id>, gitleaks/<id>, security/<topic>). severity: blocking (exploitable), major (must fix before merge), minor (observation).

      Reply with exactly one of:
      STATUS: done
      FINDINGS_JSON: [ ...only minor findings, or [] ]
      SUMMARY: <finding count first, then what you checked>

      STATUS: retry
      FINDINGS_JSON: [{"rule":"...","severity":"blocking|major|minor","file":"...","line":1,"symbol":"...","evidence":"...","expected":"..."}]
      SUMMARY: <finding count first>
    expects: "regex:^STATUS: (done|retry|blocked)$"
    max_retries: 2
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-review-checks
    type: bash
    run: node scripts/gates/review-checks.mjs
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-review
    agent: reviewer
    input: |
      Code review of the branch. You are READ-ONLY: never edit, create, delete or
      commit files. Report findings; the developer fixes them.

      REPO: {{repo}}
      BRANCH: {{branch}}
      BASE BRANCH: {{base_branch}}
      PLANS: {{plan_set}}
      LAST REVIEWED COMMIT: {{reviewed_sha}}

      ARCHITECTURE CHECKS OUTPUT (gate-review-checks, last 200 lines):
      {{gate_review_checks_output}}

      FINDINGS YOU RAISED BEFORE (JSON, with status):
      {{findings_gate_review}}

      RETRY FEEDBACK (only if your previous reply was rejected):
      {{retry_feedback}}

      Scope:
      - If LAST REVIEWED COMMIT is empty: review git diff origin/{{base_branch}}...HEAD (fall back to {{base_branch}}...HEAD).
      - Otherwise this is a re-review: review ONLY git diff {{reviewed_sha}}..HEAD (the fix commits). Do not repeat a finding whose status is resolved unless the new diff brings it back. Re-raise an open finding only if it is still present.

      Instructions:
      1. Read REVIEW.md at the repository root if it exists: its rule ids, skip paths and nit cap are binding. Otherwise use the review skill your project's CLAUDE.md names.
      2. Check: the plans' intent is met, ubiquitous language, user-facing text goes through localization, tests test behavior, living docs updated when the change warrants it, the conventions in the repository's planning docs.
      3. Every finding needs file, evidence (file:line) and the stable rule id. severity: blocking, major, minor (minor is listed in the PR, never fixed by the loop).

      Reply with exactly one of (always include REVIEWED_SHA = output of git rev-parse HEAD):
      STATUS: done
      FINDINGS_JSON: [ ...only minor findings, or [] ]
      REVIEWED_SHA: <sha>
      SUMMARY: <finding count first>

      STATUS: retry
      FINDINGS_JSON: [{"rule":"...","severity":"blocking|major|minor","file":"...","line":1,"symbol":"...","evidence":"...","expected":"..."}]
      REVIEWED_SHA: <sha>
      SUMMARY: <finding count first>
    expects: "regex:^STATUS: (done|retry|blocked)$"
    max_retries: 2
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-e2e-checks
    type: bash
    run: node scripts/gates/e2e-checks.mjs
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-e2e
    agent: tester
    input: |
      Acceptance verification in a real browser. You are READ-ONLY: never edit,
      create, delete or commit files in the repository. Keep browser artifacts
      (snapshots, screenshots, traces) in your OS temp directory, never in the repo.

      FEATURE COMPLETE: {{feature_complete}}
      If FEATURE COMPLETE is 'false', reply immediately:
      STATUS: done
      FINDINGS_JSON: []
      SUMMARY: 0 findings — E2E skipped (FEATURE_COMPLETE=false)

      Otherwise:
      REPO: {{repo}}
      BRANCH: {{branch}}
      PLANS: {{plan_set}}
      E2E SUITE OUTPUT (gate-e2e-checks, last 200 lines):
      {{gate_e2e_checks_output}}
      FINDINGS YOU RAISED BEFORE (JSON, with status):
      {{findings_gate_e2e}}
      RETRY FEEDBACK (only if your previous reply was rejected):
      {{retry_feedback}}

      Instructions:
      1. Follow the E2E / browser skill your project's CLAUDE.md names to start the app and drive it.
      2. Walk EVERY acceptance criterion of every plan in the plan set. For each unmet criterion raise a finding (rule e2e/acceptance-criterion, file = the plan file, symbol = the criterion id or a short slug, evidence = what you saw).
      3. If the plans deliver a complete user-facing feature and the repository has no E2E test covering it, raise rule e2e/missing-test (severity major, file = the feature's main UI file).

      Reply with exactly one of:
      STATUS: done
      FINDINGS_JSON: [ ...only minor findings, or [] ]
      SUMMARY: <finding count first, criteria walked>

      STATUS: retry
      FINDINGS_JSON: [{"rule":"...","severity":"blocking|major|minor","file":"...","symbol":"...","evidence":"...","expected":"..."}]
      SUMMARY: <finding count first>
    expects: "regex:^STATUS: (done|retry|blocked)$"
    max_retries: 2
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: gate-ci-local
    type: bash
    run: node scripts/gates/ci-local.mjs
    on_fail: { fix_step: fix, max_rounds: 3 }

  - id: pr
    agent: pr
    input: |
      Publish the branch and open the pull request. Do NOT merge — opening the PR is the end of the line.

      REPO: {{repo}}
      BRANCH: {{branch}}
      BASE BRANCH: {{base_branch}}
      SPEC/PLANS: {{task}}
      PLAN SUMMARY: {{plan_summary}}

      OBSERVATIONS (minor findings, list them verbatim in the PR body under "## Observations"):
      {{minor_findings}}

      RETRY FEEDBACK (only if your previous reply was rejected):
      {{retry_feedback}}

      Instructions:
      1. Push with the hooks enabled — NEVER pass --no-verify:
         git push -u origin {{branch}}
         The pre-push hook may run the local CI gate; it skips when the pipeline already passed for this commit.
      2. If the push fails because a HOOK failed (lint, build, tests, scans), do not fix anything yourself. Reply:
         STATUS: retry
         FINDINGS_JSON: [{"rule":"gate/pre-push","severity":"blocking","file":".","evidence":"<last 200 lines of the hook output>"}]
      3. If the push or the PR fails for a reason that is NOT code (remote rejected the push, authentication, network, gh not logged in), reply:
         STATUS: blocked
         REASON: <what a human must do>
      4. Open the PR:
         gh pr create --base {{base_branch}} --head {{branch}} --title "<clear title>" --body "<what & why; link {{task}}; gates passed; ## Observations>"
      5. Never merge, squash, rebase-merge or close the PR.

      On success reply:
      STATUS: done
      PR: <URL of the pull request>
    expects: "regex:^STATUS: (done|retry|blocked)$"
    max_retries: 2
    on_fail: { fix_step: fix, max_rounds: 2, return_step: gate-ci-local }

  - id: fix
    agent: developer
    input: |
      Fix the findings a gate raised. You are the ONLY agent allowed to change code.

      REPO: {{repo}}
      BRANCH: {{branch}}
      BASE BRANCH: {{base_branch}}
      PLANS: {{plan_set}}
      FAILING GATE: {{fix_origin}}

      FINDINGS (JSON — each has a fingerprint; only blocking/major are sent to you):
      {{fix_feedback}}

      RETRY FEEDBACK (only if your previous attempt was rejected):
      {{retry_feedback}}

      Rules (see your AGENTS.md "Fix step"):
      - Fix the root cause. Never disable a check, skip or delete a test, lower a threshold, or suppress a warning to make a gate pass.
      - If a finding is wrong, dispute it with a concrete reason instead of changing code. A disputed finding raised again stops the run for a human.
      - Run the unit tests affected by your change before replying. Commit with the repository's conventions. Do NOT push.

      Reply with:
      STATUS: done
      CHANGES: <what you changed, per finding>
      TESTS: <tests you ran and their result>
      RESOLVED: ["<fingerprint>", ...]
      DISPUTED_JSON: [{"fingerprint":"<fingerprint>","reason":"<why it is not a defect>"}]

      If you cannot fix the findings because the cause is not in the code (environment, credentials, a product decision), reply instead:
      STATUS: blocked
      REASON: <what a human must do>
    expects: "regex:^STATUS: (done|retry|blocked)$"
    max_retries: 2
